# Base PostgreSQL pour le développement local (optionnel si PostgreSQL est déjà installé).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match_dev_password
      POSTGRES_DB: match_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
